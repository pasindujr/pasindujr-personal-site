baseURL = "/"
title = "Pasindu Ruwandeniya"
theme = "hugo-celadon"
languageCode = "en-us"
defaultContentLanguage = "en"
enableEmoji = true
enableRobotsTXT = true

[params]
  description = "Pasindu Ruwandeniya — Software Engineer specializing in Laravel, React and scalable finance systems."
  email = "pasindujayanada@gmail.com"
  location = "Kottawa, Colombo District, Sri Lanka"

[params.homepage]
  sections = ["about", "experience", "work", "certificates", "education"]

  [params.homepage.about]
    enable = true
    layout = "hero"
    title = "About"

  [params.homepage.experience]
    enable = true
    layout = "news"
    title = "Experience"

  [params.homepage.work]
    enable = true
    layout = "cards"
    title = "Work"
    limit = 3

  [params.homepage.certificates]
    enable = true
    layout = "news"
    title = "Certificates"

  [params.homepage.education]
    enable = true
    layout = "news"
    title = "Education"

[[params.navLinks]]
label = "CV"
url = "cv.pdf"
target = "_blank"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        enableInShortcodes = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [
            ["\\[", "\\]"],
            ["$$", "$$"]
          ]
          inline = [
            ["\\(", "\\)"],
            ["$", "$"]
          ]
  [markup.highlight]
    style = "friendly"
    noClasses = false
    lineNos = true
    guessSyntax = true

# ---------------------------------------------------------
# CASCADING DEFAULTS
# Every regular page in 'content' renders with single.html
# ---------------------------------------------------------

[[cascade]]
  layout = "single"
  [cascade.target]
    path = "/**"
    kind = "page"
